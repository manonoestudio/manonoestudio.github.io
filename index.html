<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8E4EC6">
<title>manono estudio</title>
<style>:root{--a:#8E4EC6;--a-soft:color-mix(in srgb,var(--a) 12%,transparent);
  --bg:#f5f5f7;--fg:#1d1d1f;--muted:#6e6e73;--card:#ffffff;--line:rgba(0,0,0,.08);--frame:#f2f2f4;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#101013;--fg:#f5f5f7;--muted:#98989f;--card:#1c1c21;--line:rgba(255,255,255,.08);--frame:#f2f2f4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.45;
  background-image:radial-gradient(60rem 26rem at 50% -8rem,var(--a-soft),transparent 70%);background-repeat:no-repeat;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 150px}
header.top{text-align:center;margin:0 auto 22px;max-width:640px}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:22px;display:block;margin:0 0 22px;box-shadow:var(--shadow)}
.logo{width:84px;height:84px;object-fit:contain;display:block;margin:0 auto 12px;border-radius:50%}
.studio{color:var(--a);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.74rem;margin:0 0 4px}
h1{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.12;margin:0;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--muted);margin:6px 0 0;font-size:1.02rem}
.intro{max-width:600px;margin:14px auto 0;color:var(--fg);opacity:.85}
.contact{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--a);border:1.5px solid color-mix(in srgb,var(--a) 45%,transparent);
  padding:7px 15px;border-radius:999px;font-weight:600;font-size:.88rem;background:var(--card)}
h2.section{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:30px 2px 12px;display:flex;align-items:center;gap:12px}
h2.section::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.list .card{flex-direction:row}
.frame{margin:8px 8px 0;border-radius:14px;overflow:hidden;background:var(--frame);aspect-ratio:1}
.list .frame{width:118px;flex:none;margin:8px 0 8px 8px}
.frame img,.frame .ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{background:linear-gradient(135deg,var(--frame),color-mix(in srgb,var(--a) 18%,var(--frame)))}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1;min-width:0}
h3{font-size:.98rem;line-height:1.25;margin:0;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.var{color:var(--muted);font-size:.82rem;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:.85rem;margin:6px 0 0;color:var(--muted)}
.price{color:var(--fg);font-weight:800;font-size:1.08rem;margin:8px 0 0}
.vol{font-size:.74rem;font-weight:600;color:var(--a);background:var(--a-soft);padding:4px 8px;border-radius:8px;margin-top:6px;line-height:1.3;align-self:flex-start}
.bottom{margin-top:auto;padding-top:10px}
.qty{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg)}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--fg);font-size:1.2rem;font-weight:600;font-family:inherit;line-height:1}
.qty .plus{background:var(--a);color:#fff}
.qty .n{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.card.on{border-color:var(--a);box-shadow:0 0 0 1.5px var(--a),var(--shadow)}
.card.on .qty{border-color:color-mix(in srgb,var(--a) 40%,transparent)}
.opt{width:100%;margin-top:8px;padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
footer.note{margin:28px auto 0;max-width:640px;text-align:center;color:var(--muted);font-size:.9rem}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(540px,calc(100% - 20px));
  padding:12px;border-radius:22px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:10}
#bar .sum{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
#bar .sum span{font-weight:800}
#who{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;margin-bottom:8px}
#bar .send{display:flex;gap:8px}
.btn{flex:1;padding:11px 8px;border:0;border-radius:12px;background:var(--a);color:#fff;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.btn.ghost{background:var(--a-soft);color:var(--a)}
#msg{margin:6px 0 0;font-size:.82rem;color:var(--muted);text-align:center}
#msg:empty{display:none}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.cat{text-decoration:none;color:inherit}
a.cat .frame{aspect-ratio:16/10}
a.cat h3{min-height:0}
a.cat .go{color:var(--a);font-weight:700;font-size:.88rem;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:24px}
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--a);font-weight:600;font-size:.92rem;margin:0 0 10px;padding:6px 2px}
.link{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
#toggle{color:var(--fg)}
#list{max-height:38vh;overflow:auto;margin:0 0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
#list .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px;font-size:.9rem}
#list .row small{color:var(--muted)}
#list .row button{border:0;background:var(--a-soft);color:var(--a);width:28px;height:28px;border-radius:50%;flex:none;font-size:.8rem}
#clear{color:var(--muted);font-size:.85rem;margin:6px 4px 0}</style></head>

<script>
(function(){
  var cat="",cur="EUR",phone="",ig="manono.estudio",mail="manonoestudio@gmail.com",tag="#manonoestudio";
  var KEY='pedido:'+tag, WHO='pedido-nombre:'+tag;
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){return {};}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(cart));}catch(e){}}
  var cart=load();
  var items=[].slice.call(document.querySelectorAll('article[data-name]'));
  var bar=document.getElementById('bar'),list=document.getElementById('list'),who=document.getElementById('who'),msg=document.getElementById('msg');
  try{who.value=localStorage.getItem(WHO)||'';}catch(e){}
  function fmt(v){try{return v.toLocaleString('es-ES',{style:'currency',currency:cur});}catch(e){return v.toFixed(2)+' '+cur;}}
  function unit(e){var u=e.price||0;(e.tiers||[]).forEach(function(x){if(e.n>=x[0])u=x[1];});return u;}
  function keyOf(a){return a.dataset.name+'|'+a.dataset.ref;}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function entries(){return Object.keys(cart).map(function(k){var e=cart[k];e.k=k;return e;}).filter(function(e){return e.n>0;});}
  function text(){
    var es=entries(),groups={},order=[],total=0,units=0;
    es.forEach(function(e){units+=e.n;total+=e.n*unit(e);var g=e.cat||'';if(!groups[g]){groups[g]=[];order.push(g);}
      groups[g].push('- '+e.n+' × '+e.name+e.ref+(e.opt?' — '+e.opt:''));});
    var t='¡Hola! Quiero hacer este pedido:';
    order.forEach(function(g){t+='\n'+(order.length>1&&g?'\nCatálogo «'+g+'»:\n':'\n')+groups[g].join('\n');});
    if(total>0)t+='\n\nTotal aproximado: '+fmt(total);
    var w=who.value.trim(); if(w)t+='\nNombre: '+w;
    t+='\n'+tag;
    return {t:t,units:units,total:total};
  }
  function paintCards(){
    items.forEach(function(a){var e=cart[keyOf(a)],n=e?e.n:0,opt=a.querySelector('.opt');
      a.querySelector('.n').textContent=n;opt.hidden=n===0;if(e&&document.activeElement!==opt)opt.value=e.opt||'';a.classList.toggle('on',n>0);});
  }
  function paintList(){
    var es=entries(),h='';
    es.forEach(function(e){h+='<div class="row"><span><b>'+e.n+' ×</b> '+esc(e.name)+(e.opt?' <i>('+esc(e.opt)+')</i>':'')+(e.cat&&e.cat!==cat?' <small>· '+esc(e.cat)+'</small>':'')+'</span><button type="button" data-k="'+esc(e.k)+'" aria-label="Quitar">✕</button></div>';});
    h+='<button type="button" id="clear" class="link">Vaciar el pedido</button>';
    list.innerHTML=h;
    [].slice.call(list.querySelectorAll('button[data-k]')).forEach(function(b){b.onclick=function(){delete cart[b.dataset.k];save();update();};});
    document.getElementById('clear').onclick=function(){cart={};save();update();list.hidden=true;};
  }
  function update(){
    var r=text(); bar.hidden=r.units===0;
    document.getElementById('units').textContent=r.units+(r.units===1?' pieza':' piezas');
    document.getElementById('total').textContent=r.total>0?fmt(r.total):'';
    paintCards(); if(!list.hidden)paintList();
  }
  function change(a,delta){
    var k=keyOf(a),e=cart[k]||{name:a.dataset.name,ref:a.dataset.ref,n:0,opt:''};
    e.price=+a.dataset.price||0;try{e.tiers=JSON.parse(a.dataset.tiers||'[]');}catch(x){e.tiers=[];}
    e.cat=cat;e.n=Math.max(0,(e.n||0)+delta);e.opt=a.querySelector('.opt').value.trim();
    if(e.n>0)cart[k]=e;else delete cart[k];save();update();
  }
  items.forEach(function(a){
    a.querySelector('.plus').onclick=function(){change(a,1);};
    a.querySelector('.minus').onclick=function(){change(a,-1);};
    a.querySelector('.opt').oninput=function(){var e=cart[keyOf(a)];if(e){e.opt=this.value.trim();save();}};
  });
  who.oninput=function(){try{localStorage.setItem(WHO,who.value);}catch(e){}};
  document.getElementById('toggle').onclick=function(){list.hidden=!list.hidden;if(!list.hidden)paintList();};
  window.addEventListener('pageshow',function(){cart=load();update();});
  window.addEventListener('storage',function(){cart=load();update();});
  function copy(t){
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){msg.textContent='Pedido copiado: pégalo en el mensaje.';},function(){msg.textContent='No se pudo copiar.';});}
    else{msg.textContent='No se pudo copiar.';}}
  [].slice.call(document.querySelectorAll('#bar .send button')).forEach(function(b){
    b.onclick=function(){
      var t=text().t,to=b.dataset.to;
      if(to==='wa'){location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(t);}
      else if(to==='ig'){copy(t);setTimeout(function(){location.href='https://ig.me/m/'+ig;},700);}
      else if(to==='mail'){location.href='mailto:'+mail+'?subject='+encodeURIComponent('Pedido')+'&body='+encodeURIComponent(t);}
      else{copy(t);}
    };
  });
  update();
})();
</script>
</body></html>
