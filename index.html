<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8E4EC6">
<title>manono estudio</title>
<style>:root{--a:#8E4EC6;--a-soft:color-mix(in srgb,var(--a) 12%,transparent);
  --bg:#f5f5f7;--fg:#1d1d1f;--muted:#6e6e73;--card:#ffffff;--line:rgba(0,0,0,.08);--frame:#f2f2f4;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#101013;--fg:#f5f5f7;--muted:#98989f;--card:#1c1c21;--line:rgba(255,255,255,.08);--frame:#f2f2f4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.45;
  background-image:radial-gradient(60rem 26rem at 50% -8rem,var(--a-soft),transparent 70%);background-repeat:no-repeat;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 150px}
header.top{text-align:center;margin:0 auto 22px;max-width:640px}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:22px;display:block;margin:0 0 22px;box-shadow:var(--shadow)}
.logo{width:84px;height:84px;object-fit:contain;display:block;margin:0 auto 12px;border-radius:50%}
.studio{color:var(--a);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.74rem;margin:0 0 4px}
h1{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.12;margin:0;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--muted);margin:6px 0 0;font-size:1.02rem}
.intro{max-width:600px;margin:14px auto 0;color:var(--fg);opacity:.85}
.contact{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--a);border:1.5px solid color-mix(in srgb,var(--a) 45%,transparent);
  padding:7px 15px;border-radius:999px;font-weight:600;font-size:.88rem;background:var(--card)}
h2.section{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:30px 2px 12px;display:flex;align-items:center;gap:12px}
h2.section::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.list .card{flex-direction:row}
.frame{margin:8px 8px 0;border-radius:14px;overflow:hidden;background:var(--frame);aspect-ratio:1}
.list .frame{width:118px;flex:none;margin:8px 0 8px 8px}
.frame img,.frame .ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{background:linear-gradient(135deg,var(--frame),color-mix(in srgb,var(--a) 18%,var(--frame)))}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1;min-width:0}
h3{font-size:.98rem;line-height:1.25;margin:0;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.var{color:var(--muted);font-size:.82rem;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:.85rem;margin:6px 0 0;color:var(--muted)}
.price{color:var(--fg);font-weight:800;font-size:1.08rem;margin:8px 0 0}
.vol{font-size:.74rem;font-weight:600;color:var(--a);background:var(--a-soft);padding:4px 8px;border-radius:8px;margin-top:6px;line-height:1.3;align-self:flex-start}
.bottom{margin-top:auto;padding-top:10px}
.qty{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg)}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--fg);font-size:1.2rem;font-weight:600;font-family:inherit;line-height:1}
.qty .plus{background:var(--a);color:#fff}
.qty .n{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.card.on{border-color:var(--a);box-shadow:0 0 0 1.5px var(--a),var(--shadow)}
.card.on .qty{border-color:color-mix(in srgb,var(--a) 40%,transparent)}
.opt{width:100%;margin-top:8px;padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
footer.note{margin:28px auto 0;max-width:640px;text-align:center;color:var(--muted);font-size:.9rem}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(540px,calc(100% - 20px));
  padding:12px;border-radius:22px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:10}
#bar .sum{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
#bar .sum span{font-weight:800}
#who{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;margin-bottom:8px}
#bar .send{display:flex;gap:8px}
.btn{flex:1;padding:11px 8px;border:0;border-radius:12px;background:var(--a);color:#fff;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.btn.ghost{background:var(--a-soft);color:var(--a)}
#msg{margin:6px 0 0;font-size:.82rem;color:var(--muted);text-align:center}
#msg:empty{display:none}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.cat{text-decoration:none;color:inherit}
a.cat .frame{aspect-ratio:16/10}
a.cat h3{min-height:0}
a.cat .go{color:var(--a);font-weight:700;font-size:.88rem;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:24px}
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--a);font-weight:600;font-size:.92rem;margin:0 0 10px;padding:6px 2px}
.link{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
#toggle{color:var(--fg)}
#list{max-height:38vh;overflow:auto;margin:0 0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
#list .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px;font-size:.9rem}
#list .row small{color:var(--muted)}
#list .row button{border:0;background:var(--a-soft);color:var(--a);width:28px;height:28px;border-radius:50%;flex:none;font-size:.8rem}
#clear{color:var(--muted);font-size:.85rem;margin:6px 4px 0}.badge{display:inline-block;font-size:.7rem;font-weight:700;color:var(--a);background:var(--a-soft);padding:3px 8px;border-radius:999px;margin-top:6px;align-self:flex-start}
.mini{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:8px;min-height:14px}
.mini i{width:14px;height:14px;border-radius:50%;background:var(--c);display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.mini b{font-size:.72rem;color:var(--muted);font-weight:600;margin-left:2px}
.cz-open{width:100%}
.incart{margin:6px 0 0;font-size:.78rem;color:var(--a);font-weight:700;text-align:center}
.chips{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 2px;margin:0 -2px;scrollbar-width:none;
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chips::-webkit-scrollbar,.cz-tabs::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.85rem}
h2.section{scroll-margin-top:64px}
#panel[hidden]{display:none}
#notes{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;margin:0 0 10px;resize:vertical}
#list .row{align-items:flex-start}
#list .rtxt{min-width:0}
#list .sub{display:block;color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:2px}
#list .racts{display:flex;gap:6px;flex:none}
body.lock{overflow:hidden}
.cz{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.cz[hidden]{display:none}
.cz-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
.cz.open .cz-bg{opacity:1}
.cz-panel{position:relative;width:min(560px,100%);max-height:94vh;max-height:94dvh;background:var(--card);border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
.cz.open .cz-panel{transform:none}
@media (min-width:700px){.cz{align-items:center}.cz-panel{border-radius:24px;max-height:90vh}}
.cz-head{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px 10px;gap:12px}
.cz-kicker{margin:0;color:var(--a);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.cz-head h2{margin:2px 0 0;font-size:1.25rem;line-height:1.2}
.cz-x{border:0;background:var(--bg);color:var(--fg);width:34px;height:34px;border-radius:50%;font-size:.9rem;flex:none;cursor:pointer}
.cz-scroll{overflow:auto;padding:0 18px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cz-pw{position:sticky;top:0;z-index:2;background:var(--card);margin:0 -18px;padding:0 18px 12px}
.cz-pw[hidden]{display:none}
.cz-prev{background:var(--frame);border-radius:18px;display:flex;position:relative;justify-content:center;align-items:center;height:min(28vh,260px);overflow:hidden}
.cz-prev canvas,.cz-prev img{max-width:92%;max-height:92%;object-fit:contain;display:block}
.cz-prev canvas[hidden],.cz-prev img[hidden]{display:none}
.cz-qty{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px;font-weight:650}
.cz-qty .qty{width:144px}
.cz-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.cz-tab{flex:none;display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 11px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.cz-tab.on{border-color:var(--a);background:var(--a-soft);color:var(--a)}
.cz-tab.bad{border-color:#e5484d;color:#e5484d}
.cz-tab i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.cz-copy{color:var(--a);font-size:.85rem;font-weight:600;margin:0 0 4px}
.cz-unit{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:12px 0 2px;font-weight:700}
#czb h4{margin:14px 0 8px;font-size:.95rem}
.cz-combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.cz-combo{display:flex;flex-direction:column;gap:7px;align-items:stretch;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:14px;padding:8px;font:inherit;font-weight:650;font-size:.85rem;text-align:left;cursor:pointer}
.cz-combo.on{border-color:var(--a);box-shadow:0 0 0 1.5px var(--a)}
.strip{display:flex;height:22px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.strip i{flex:1;background:var(--c)}
.cz-hint{font-size:.82rem;color:var(--muted);margin:12px 0 0}
.cz-slot{padding:12px 0;border-bottom:1px solid var(--line)}
.cz-top{display:flex;align-items:center;gap:10px}
.cz-pimg{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--frame);flex:none}
.cz-sh{display:flex;flex-direction:column;min-width:0}
.cz-sh b{font-size:.98rem}
.cz-sh span{color:var(--muted);font-size:.85rem}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.dot{width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer;flex:none}
.dot.on{box-shadow:0 0 0 2.5px var(--a)}
.dot.fixed{cursor:default;width:26px;height:26px;border-width:2px}
.cz-l{display:block;margin:14px 0 0;font-weight:650;font-size:.92rem;position:relative}
.cz-l[hidden]{display:none}
.cz-l span{color:var(--muted);font-weight:400}
.cz-l em{color:#e5484d;font-style:normal}
.cz-l input,.cz-l textarea{display:block;width:100%;margin-top:6px;padding:11px 54px 11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;font-weight:400;resize:vertical}
.cz-l textarea{padding-right:12px}
.cz-l input.bad{border-color:#e5484d;box-shadow:0 0 0 1px #e5484d}
.cz-l small{position:absolute;right:12px;bottom:13px;color:var(--muted);font-size:.72rem;font-weight:400}
.cz-foot{padding:10px 18px 14px;border-top:1px solid var(--line)}
.cz-m{margin:0 0 8px;font-size:.9rem;color:var(--muted);text-align:center}
.cz-m:empty{display:none}
.cz-m b{color:var(--fg)}
.cz-m .up{display:block;color:var(--a);font-weight:700;margin-top:2px}
.cz-m .err{color:#e5484d;font-weight:700}
.cz-add{width:100%;padding:14px;font-size:1rem}
.cz3{position:absolute;inset:0}
.cz3[hidden]{display:none}
.cz3 canvas{width:100%!important;height:100%!important;max-width:none;max-height:none;touch-action:none;display:block}
.cz3.loading::after{content:"Cargando 3D…";position:absolute;inset:auto 0 12px;text-align:center;color:var(--muted);font-size:.8rem}
.cz-prev{position:relative}
.cz-prev[hidden]{display:none}
.cz-h3{position:absolute;left:0;right:0;bottom:8px;margin:0;text-align:center;font-size:.72rem;color:#6e6e73;pointer-events:none}
.cz-h3[hidden]{display:none}
.cz-view{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:3px;margin:0 0 8px}
.cz-view[hidden]{display:none}
.cz-view button{flex:1;border:0;background:transparent;color:var(--fg);font:inherit;font-weight:650;font-size:.85rem;padding:7px;border-radius:9px;cursor:pointer}
.cz-view button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cz-gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;height:min(28vh,260px);scrollbar-width:none}
.cz-gal[hidden]{display:none}
.cz-gal::-webkit-scrollbar{display:none}
.cz-gal img{height:100%;max-width:86%;flex:none;object-fit:cover;border-radius:14px;scroll-snap-align:center;cursor:zoom-in;background:var(--frame)}
.frame.zoom{cursor:zoom-in;position:relative}
.frame.zoom::after{content:attr(data-n);position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:999px}
.frame.zoom[data-n=""]::after{display:none}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center}
.lb[hidden]{display:none}
.lb-strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:82vh;scrollbar-width:none}
.lb-strip::-webkit-scrollbar{display:none}
.lb-strip img{flex:none;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.lb-x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:2;border:0;background:rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:50%;font-size:1rem;cursor:pointer}
.lb-n{color:#ddd;text-align:center;font-size:.85rem;margin:10px 0 0}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:650;font-size:.9rem;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.toast[hidden]{display:none}
.toast.show{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}</style></head>

function qtyBy(fn,k,skip){var q=0;Object.keys(cart).forEach(function(x){var e=cart[x];if(x!==skip&&e&&e.n>0&&fn(e)===k)q+=e.n;});return q;}

function entries(){return Object.keys(cart).map(function(k){var e=cart[k];if(e)e.k=k;return e;}).filter(function(e){return e&&e.n>0;});}

/* ---------- Pedido ---------- */

    var l='- '+e.n+' × '+e.name+e.ref+(e.opt?' — '+e.opt:'');
    (e.lines||[]).forEach(function(x){l+='\n   ↳ '+x;});
    if(e.notes)l+='\n   ↳ Notas: '+e.notes;
    groups[g].push(l);});

  order.forEach(function(g){t+='\n'+(order.length>1&&g?'\nCatálogo «'+g+'»:\n':'\n')+groups[g].join('\n');});
  if(total>0)t+='\n\nTotal aproximado: '+fmt(total);

  else{msg.textContent='No se pudo copiar.';}}

  who.value=getv(WHO);notes.value=getv(NOTES);
  items.forEach(function(a){
    var p=a.querySelector('.plus'),m=a.querySelector('.minus'),o=a.querySelector('.opt'),c=a.querySelector('.cz-open');

  window.addEventListener('pageshow',function(){cart=load();update();});
  window.addEventListener('storage',function(){cart=load();update();});
  each('#bar .send button',function(b){
    b.onclick=function(){
      var t=text().t,to=b.dataset.to;
      if(to==='wa'){location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(t);}
      else if(to==='ig'){copy(t);setTimeout(function(){location.href='https://ig.me/m/'+ig;},700);}

  V3.scene.add(V3.mesh);

function show3D(cfg){

var cz=$('cz'),S=null,pv={base:null,ctx:null,mode:''};

function clone(x){return JSON.parse(JSON.stringify(x));}

  if(showCombos){
    h+='<h4>'+(cfg.mode==='combos'?'Elige una combinación':'Combinaciones')+'</h4><div class="cz-combos">';
    cfg.combos.forEach(function(cb){h+='<button type="button" class="cz-combo'+(u.combo===cb.id?' on':'')+'" data-cb="'+cb.id+'" aria-pressed="'+(u.combo===cb.id)+'"><span class="strip">'+strip(cfg,cb)+'</span><span>'+esc(cb.name)+'</span></button>';});
    h+='</div>';
    if(cfg.mode==='both')h+='<p class="cz-hint">'+(u.combo?'O cambia cada pieza a tu gusto:':'Combinación a tu gusto:')+'</p>';
  }
  cfg.slots.forEach(function(s){
    var o=optOf(s,u.c[s.id]),pick=!s.fixed&&canPick;
    h+='<div class="cz-slot"><div class="cz-top">'+(s.img?'<img class="cz-pimg" src="'+s.img+'" alt="">':'');
    if(!pick)h+='<span class="dot on fixed" style="--c:'+(o?o.hex:'#ccc')+'"></span>';
    h+='<div class="cz-sh"><b>'+esc(s.name)+'</b><span>'+esc(o?o.name:'')+(s.fixed?' · color fijo':'')+'</span></div></div>';
    if(pick){
      h+='<div class="sw" role="radiogroup" aria-label="'+esc(s.name)+'">';
      s.options.forEach(function(op){var on=op.id===u.c[s.id];h+='<button type="button" role="radio" aria-checked="'+on+'" class="dot'+(on?' on':'')+'" style="--c:'+op.hex+'" data-s="'+s.id+'" data-o="'+op.id+'" title="'+esc(op.name)+'" aria-label="'+esc(op.name)+'"></button>';});
      h+='</div>';
    }
    h+='</div>';
  });
  cfg.texts.forEach(function(t){
    var v=String(u.t[t.id]||''),bad=S.bad[S.cur]&&t.req&&!v.trim();
    h+='<label class="cz-l">'+esc(t.label)+(t.req?' <em>*</em>':' <span>(opcional)</span>')+'<input type="text" '+(t.kind==='number'?'inputmode="numeric" ':'')+'maxlength="'+t.max+'" data-t="'+t.id+'" value="'+esc(v)+'" placeholder="'+esc(t.ph)+'"'+(bad?' class="bad"':'')+' autocomplete="off"><small>'+v.length+'/'+t.max+'</small></label>';
  });
  $('czb').innerHTML=h;
  wire();paint();foot();
}
function wire(){
  var cfg=S.cfg;
  each('#czu .cz-tab',function(b){b.onclick=function(){S.cur=+b.dataset.u;render();};});
  $('czminus').onclick=function(){if(S.units.length>1){S.units.pop();if(S.cur>=S.units.length)S.cur=S.units.length-1;render();}};
  $('czplus').onclick=function(){var last=clone(S.units[S.units.length-1]);last.t={};S.units.push(last);S.cur=S.units.length-1;render();};
  var cp=$('czcopy');if(cp)cp.onclick=function(){var src=S.units[S.cur];S.units=S.units.map(function(x,i){if(i===S.cur)return x;var c=clone(src);c.t=x.t;return c;});toast('Mismos colores en todas');render();};
  each('#czb .cz-combo',function(b){b.onclick=function(){var cb=comboOf(cfg,b.dataset.cb);if(cb)useCombo(S.units[S.cur],cb);render();};});
  each('#czb .dot[data-o]',function(b){b.onclick=function(){var u=S.units[S.cur];u.c[b.dataset.s]=b.dataset.o;u.combo=matchCombo(cfg,u);render();};});
  each('#czb input[data-t]',function(inp){inp.oninput=function(){
    var t=textOf(cfg,inp.dataset.t),v=inp.value;
    if(t&&t.kind==='number'){v=v.replace(/[^0-9]/g,'');if(v!==inp.value)inp.value=v;}
    S.units[S.cur].t[inp.dataset.t]=v;
    var sm=inp.nextElementSibling;if(sm)sm.textContent=v.length+'/'+inp.maxLength;
    inp.classList.remove('bad');
  };});
}
function foot(){
  var n=S.units.length,q=n+qtyBy(gkey,gkey(S.info),S.key),u=unitFor(S.info.price,S.info.tiers,q),m='';
  if(S.info.price>0){
    m=n+' × '+fmt(u)+' = <b>'+fmt(u*n)+'</b>';
    if(q>n)m+='<span class="up">Precio de '+q+' uds sumando lo que ya tienes'+(S.info.vg?' de «'+esc(S.info.vg)+'»':'')+'</span>';
    var next=null;(S.info.tiers||[]).forEach(function(t){if(t[0]>q&&(!next||t[0]<next[0]))next=t;});
    if(next&&next[1]<u)m+='<span class="up">Añade '+(next[0]-q)+' más'+(S.info.vg?' (puede ser otro modelo «'+esc(S.info.vg)+'»)':'')+' y cada una sale a '+fmt(next[1])+'</span>';
  }
  $('czm').innerHTML=m;
  $('cza').textContent=(S.key?'Guardar cambios':'Añadir '+(n>1?n+' ':'')+'al pedido')+(S.info.price>0?' · '+fmt(u*n):'');
}
if(cz){
  $('czx').onclick=closeCZ;$('czbg').onclick=closeCZ;
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){if(lb&&!lb.hidden){lb.hidden=true;}else if(S)closeCZ();}});
  $('cza').onclick=function(){
    var cfg=S.cfg,bad={},first=-1;
    S.units.forEach(function(u,i){cfg.texts.forEach(function(t){if(t.req&&!String(u.t[t.id]||'').trim()){bad[i]=true;if(first<0)first=i;}});});
    S.bad=bad;
    if(first>=0){
      S.cur=first;render();
      var b=$('czb').querySelector('input.bad');if(b)b.focus();
      $('czm').innerHTML='<span class="err">'+(S.units.length>1?'Falta rellenar la unidad '+(first+1):'Falta rellenar el texto')+'</span>';
      return;
    }
    var k=S.key||('c:'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    cart[k]={name:S.info.name,ref:S.info.ref,price:S.info.price,tiers:S.info.tiers,vg:S.info.vg,cat:S.cat,n:S.units.length,pid:S.pid,units:S.units,lines:linesOf(cfg,S.units),notes:$('czn').value.trim()};
    var edited=!!S.key;
    save();closeCZ();update();toast(edited?'Pedido actualizado':'Añadido al pedido ✓');
  };
}
update();
})();
</script>
</body></html>
