<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Catálogo Toppers</title>
<style>
:root{--a:#8E4EC6;color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f6f6f8;color:#1c1c1e;line-height:1.4}
main{max-width:1000px;margin:0 auto;padding:28px 18px 48px}
.logo{max-width:110px;max-height:110px;display:block;margin-bottom:10px}
.studio{color:var(--a);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;margin:0}
h1{font-size:2rem;margin:.2rem 0}
.sub{color:#6e6e73;margin:0 0 .6rem;font-size:1.1rem}
.intro{max-width:640px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.btn{background:var(--a);color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem}
h2{color:var(--a);text-transform:uppercase;font-size:.95rem;letter-spacing:.06em;margin:34px 0 12px;border-bottom:1px solid;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.list{display:flex;flex-direction:column;gap:12px}
article{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.list article{display:flex;gap:14px;align-items:flex-start}
article img,.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#ececf0}
.list article img,.list .ph{width:120px;flex:none}
.info{padding:12px 14px 14px}
h3{font-size:1rem;margin:0 0 2px}
.info p{margin:4px 0;font-size:.88rem;color:#3a3a3c}
.var{color:#8e8e93!important}
.price{color:var(--a)!important;font-weight:700;font-size:1.05rem!important}
footer{margin-top:34px;padding:16px;border-radius:14px;background:#ececf0;font-size:.9rem;color:#3a3a3c}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:var(--a);color:#fff;font-size:1.2rem;font-weight:700}
.qty .minus{background:#d1d1d6;color:#1c1c1e}
.qty .n{min-width:20px;text-align:center;font-weight:700}
.opt{width:100%;margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid #d1d1d6;font:inherit}
article.on{outline:3px solid var(--a)}
#bar{position:sticky;bottom:12px;margin-top:24px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
#bar .sum{margin-bottom:8px}
#who{width:100%;padding:10px;border-radius:12px;border:1px solid #d1d1d6;font:inherit;margin-bottom:10px}
#bar .send{display:flex;flex-wrap:wrap;gap:8px}
#bar .send button{flex:1;min-width:90px;padding:12px;border:0;border-radius:999px;background:var(--a);color:#fff;font-weight:700;font:inherit;font-weight:700}
#msg{margin:8px 0 0;font-size:.85rem;color:#6e6e73}
@media (prefers-color-scheme:dark){#bar{background:rgba(28,28,30,.92)}.opt,#who{background:#2c2c2e;color:#f2f2f7;border-color:#3a3a3c}}
@media (prefers-color-scheme:dark){body{background:#000;color:#f2f2f7}article{background:#1c1c1e}.info p,footer{color:#d1d1d6}footer,.ph,article img{background:#2c2c2e}.sub{color:#98989d}}
</style></head>

<script>
(function(){
  var title="Catálogo Toppers", studio="manono estudio", cur="EUR";
  var phone="", ig="manono.estudio", mail="manonoestudio@gmail.com";
  var items=[].slice.call(document.querySelectorAll('article'));
  var bar=document.getElementById('bar');
  function fmt(v){try{return v.toLocaleString('es-ES',{style:'currency',currency:cur});}catch(e){return v.toFixed(2)+' '+cur;}}
  function text(){
    var lines=[],units=0,total=0;
    items.forEach(function(a){
      var n=+a.querySelector('.n').textContent; if(!n)return;
      units+=n; total+=n*(+a.dataset.price||0);
      var o=a.querySelector('.opt').value.trim();
      lines.push('- '+n+' × '+a.dataset.name+a.dataset.ref+(o?' — '+o:''));
    });
    var who=document.getElementById('who').value.trim();
    var t='¡Hola! Quiero hacer este pedido del catálogo «'+title+'»:\n'+lines.join('\n');
    if(total>0)t+='\nTotal aproximado: '+fmt(total);
    if(who)t+='\nNombre: '+who;
    t+='\n#I3D';
    return {t:t,units:units,total:total};
  }
  function update(){
    var r=text(); bar.hidden=r.units===0;
    document.getElementById('units').textContent=r.units+(r.units===1?' pieza':' piezas');
    document.getElementById('total').textContent=r.total>0?' · '+fmt(r.total):'';
  }
  items.forEach(function(a){
    var n=a.querySelector('.n'),opt=a.querySelector('.opt');
    a.querySelector('.plus').onclick=function(){n.textContent=+n.textContent+1;opt.hidden=false;a.classList.add('on');update();};
    a.querySelector('.minus').onclick=function(){var v=Math.max(0,+n.textContent-1);n.textContent=v;opt.hidden=v===0;a.classList.toggle('on',v>0);update();};
    opt.oninput=update;
  });
  document.getElementById('who').oninput=update;
  function copy(t){if(navigator.clipboard){navigator.clipboard.writeText(t);}document.getElementById('msg').textContent='Pedido copiado. Pégalo en el mensaje.';}
  [].slice.call(document.querySelectorAll('#bar .send button')).forEach(function(b){
    b.onclick=function(){
      var t=text().t, to=b.dataset.to;
      if(to==='wa'){location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(t);}
      else if(to==='ig'){copy(t);setTimeout(function(){location.href='https://ig.me/m/'+ig;},600);}
      else if(to==='mail'){location.href='mailto:'+mail+'?subject='+encodeURIComponent('Pedido: '+title)+'&body='+encodeURIComponent(t);}
      else{copy(t);}
    };
  });
})();
</script>
